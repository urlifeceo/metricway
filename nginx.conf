limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

# ============================
# HTTP → HTTPS
# ============================
server {
    listen 80;
    server_name metricway.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================
# HTTPS + WAF
# ============================
server {
    listen 443 ssl;
    http2 on;
    server_name metricway.tech;

    ssl_certificate /etc/letsencrypt/live/metricway.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metricway.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;

    # ============================
    # COLLECTOR — БЕЗ WAF
    # ============================
    location /collector/ {
        proxy_pass http://tgmetrics-collector:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключаем буферизацию, чтобы Nginx передавал байты "как есть"
        proxy_request_buffering off;

        limit_except POST { deny all; }
    }

    # ============================
    # BACKEND — WAF включён
    # ============================
    location /api/v1/ {

        if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) { return 405; }
        if ($query_string ~* "(union|select|insert|update|delete|drop|information_schema)") { return 403; }
        if ($query_string ~* "<script>|javascript:|onerror=|onload=") { return 403; }
        if ($http_user_agent ~* "(l9scan|leakix|masscan|nmap|zgrab|nikto)") { return 403; }

        limit_req zone=api_limit burst=200 nodelay;

        proxy_pass http://tgmetrics-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============================
    # FRONTEND (все запросы, включая статику)
    # ============================
    location / {

        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        if ($http_user_agent ~* "(l9scan|leakix|masscan|nmap|zgrab|nikto)") { return 403; }

        proxy_pass http://tgmetrics-frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}