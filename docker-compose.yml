version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: tgmetrics-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: "tgmetrics"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: "secret_password"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: tgmetrics-collector
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: ":8080"
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_DB: "tgmetrics"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "secret_password"
      BATCH_SIZE: "1000"
      FLUSH_INTERVAL_SEC: "2"
    depends_on:
      clickhouse:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tgmetrics-backend
    ports:
      - "8001:8001"
    environment:
      CH_HOST: "clickhouse"
      CH_PORT: "8123"
      CH_USER: "default"
      CH_PASSWORD: "secret_password"
      CH_DATABASE: "tgmetrics"
      JWT_SECRET: "super_secret_jwt_key_change_me"
    depends_on:
      clickhouse:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tgmetrics-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  metric-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.bot.main
    env_file:
      - ./backend/.env
    depends_on:
      - clickhouse

  nginx:
    image: nginx:stable-alpine
    container_name: tgmetrics-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/certs:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/certs:/etc/letsencrypt

volumes:
  ch_data: